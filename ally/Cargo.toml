[package]
name = "hf-ally"
version = "1.4.0"
edition = "2021"
description = "AI wingman ship, pre-combat ally/plane controls, enemy wave sizing and intercept fixes for HighFleet 1.163."

[features]
# Legacy build flag. Debug mode is now controlled at runtime by logging.debug_log in ally.json.
megalog = []

[lib]
name = "ally"
crate-type = ["cdylib"]

[dependencies]
hf-mod-support = { path = "../shared" }
highfleet = { git = "https://github.com/logdot/highfleet-rs.git", rev = "05c62078c6f896c141713a68b3991663e121b7bf" }
highfleet-mod-api = { git = "https://github.com/logdot/Highfleet-Modloader.git", tag = "v4.2.0-preview.1" }
log = "0.4.28"
patchy_host = { package = "highfleet-patchy-client", git = "https://github.com/logdot/Highfleet-Modloader.git", tag = "v4.2.0-preview.1" }
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0.144"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Kernel", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus"] }
