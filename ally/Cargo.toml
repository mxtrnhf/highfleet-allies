[package]
name = "hf-ally"
version = "1.0.0"
edition = "2021"
description = "AI wingman ship, pre-combat ally/plane controls, enemy wave sizing and intercept fixes for HighFleet 1.163."

[features]
# Legacy build flag. Debug mode is now controlled at runtime by logging.debug_log in ally.json.
megalog = []

[lib]
name = "hf_ally"
crate-type = ["cdylib"]

[dependencies]
highfleet = { git = "https://github.com/logdot/highfleet-rs.git", rev = "05c62078c6f896c141713a68b3991663e121b7bf" }
highfleet-mod-api = { git = "https://github.com/logdot/Highfleet-Modloader.git", tag = "v4.0.0" }
log = "0.4.28"
patchy = { package = "patchy-rs", git = "https://github.com/logdot/patchy-rs.git", tag = "v0.1.0" }
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0.144"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Kernel", "Win32_Storage_FileSystem"] }
