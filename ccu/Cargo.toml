[package]
name = "hf-ccu"
version = "0.1.0"
edition = "2021"
description = "Cruisers & Carriers Update: campaign shelling for HighFleet Steam 1.163."

[lib]
name = "ccu"
crate-type = ["cdylib"]

[dependencies]
hf-mod-support = { path = "../shared" }
highfleet = { git = "https://github.com/logdot/highfleet-rs.git", rev = "05c62078c6f896c141713a68b3991663e121b7bf" }
highfleet-mod-api = { git = "https://github.com/logdot/Highfleet-Modloader.git", tag = "v4.2.0-preview.1" }
patchy_host = { package = "highfleet-patchy-client", git = "https://github.com/logdot/Highfleet-Modloader.git", tag = "v4.2.0-preview.1" }
log = "0.4.28"
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0.144"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
